name: Build Windows internal release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Keep release out of automatic updates pending physical capture QA
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci

      - name: Verify capture and local recording storage
        run: |
          npm run verify
          npm test

      - name: Audit dependencies and verify Electron media runtime and shell hardening
        run: |
          npm audit --audit-level=low
          npm run test:media-runtime
          npm run test:shell

      - name: Build x64 internal installer
        run: npm run dist:win
        env:
          FORGENOTES_SUPABASE_ANON_KEY: ${{ secrets.FORGENOTES_SUPABASE_ANON_KEY }}

      # The Microsoft Store package: an UNSIGNED .appx that Partner Center accepts and
      # Microsoft re-signs after certification. Never attached to the GitHub release —
      # it is only useful uploaded to the Store, and publishing an unsigned installer
      # alongside the NSIS one would just confuse people.
      - name: Build Microsoft Store package (appx)
        run: npm run dist:store
        env:
          FORGENOTES_SUPABASE_ANON_KEY: ${{ secrets.FORGENOTES_SUPABASE_ANON_KEY }}

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v7
        with:
          name: forgenotes-recorder-appx
          path: release/*.appx
          if-no-files-found: error

      - name: Verify installer + auto-update assets, create checksum
        shell: pwsh
        run: |
          $installer = 'release/ForgeNotes-Recorder-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if ((Get-Item $installer).Length -lt 50MB) { throw 'Installer is unexpectedly small' }
          # electron-updater in installed apps polls releases/latest/download/latest.yml —
          # a release without latest.yml + .blockmap silently BREAKS auto-update for every
          # installed copy (this happened with v0.4.0). Fail the build instead.
          if (-not (Test-Path 'release/latest.yml')) { throw 'Missing release/latest.yml (auto-update feed)' }
          if (-not (Test-Path 'release/ForgeNotes-Recorder-Setup.exe.blockmap')) { throw 'Missing installer blockmap (differential auto-update)' }
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + '  ForgeNotes-Recorder-Setup.exe' |
            Set-Content 'release/ForgeNotes-Recorder-Setup.exe.sha256' -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ForgeNotes-Recorder-Windows-${{ github.sha }}
          path: |
            release/ForgeNotes-Recorder-Setup.exe
            release/ForgeNotes-Recorder-Setup.exe.blockmap
            release/latest.yml
            release/ForgeNotes-Recorder-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # Tag push: publish exactly that tag (--verify-tag, unchanged behavior).
          # Manual dispatch: publish v<package.json version> and let gh mint the tag
          # at this commit via --target — so releases can be cut from environments
          # that can push branches but not tags.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            EXTRA=(--verify-tag)
          else
            TAG="v$(node -p "require('./package.json').version")"
            EXTRA=(--target "$GITHUB_SHA")
          fi
          if [[ "$RELEASE_DRAFT" == "true" ]]; then EXTRA+=(--draft); fi
          gh release create "$TAG" \
            release/ForgeNotes-Recorder-Setup.exe \
            release/ForgeNotes-Recorder-Setup.exe.blockmap \
            release/latest.yml \
            release/ForgeNotes-Recorder-Setup.exe.sha256 \
            "${EXTRA[@]}" \
            --title "$TAG — internal Windows build" \
            --notes "Internal unsigned Windows build. Windows SmartScreen may require More info → Run anyway."
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
